<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Break Timer | مؤقت الاستراحة المرئي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Fallback font stack that supports both English (Inter) and Arabic (Cairo) smoothly */
            font-family: 'Inter', 'Cairo', sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrolling when in fullscreen timer mode */
            transition: background-color 0.3s;
        }
        
        .timer-font {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            /* Scale font size based on viewport width to always fill the screen horizontally */
            font-size: 22vw;
            line-height: 1;
            text-shadow: 0 10px 25px rgba(0,0,0,0.2);
            direction: ltr; /* Force LTR for the clock numbers so they never flip */
        }
        
        @media (max-width: 768px) {
            .timer-font {
                font-size: 28vw;
            }
        }
        
        /* Smooth background and text color transitions for the timer */
        .color-transition {
            transition: background-color 1s ease-in-out, color 0.5s ease-in-out;
        }

        /* RTL-specific styling adjustments handled by CSS attribute selectors */
        html[dir="rtl"] body {
            font-family: 'Cairo', 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Setup Screen -->
    <div id="setup-screen" class="flex flex-col items-center justify-center min-h-screen p-6 relative">
        
        <!-- Language Toggle Button -->
        <div class="absolute top-6 right-6 rtl:left-6 rtl:right-auto z-20">
            <button onclick="toggleLanguage()" class="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-full border border-gray-600 transition shadow-lg text-sm font-semibold">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                <span id="lang-btn-text">عربي</span>
            </button>
        </div>

        <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-700 z-10">
            <div class="text-center mb-8">
                <h1 id="ui-title" class="text-3xl font-bold mb-2">Break Timer</h1>
                <p id="ui-subtitle" class="text-gray-400 text-sm">Traffic light visual system: Green → Yellow (2 min warning) → Red</p>
            </div>

            <div class="space-y-4 mb-8">
                <button onclick="startTimer(15)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 px-6 rounded-xl transition shadow-lg flex justify-between items-center text-lg">
                    <span id="ui-btn-15">15 Minutes</span>
                    <span id="ui-desc-15" class="text-emerald-200 text-sm">Standard Break</span>
                </button>
                <button onclick="startTimer(10)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 px-6 rounded-xl transition shadow-lg flex justify-between items-center text-lg">
                    <span id="ui-btn-10">10 Minutes</span>
                    <span id="ui-desc-10" class="text-emerald-200 text-sm">Group Exercise</span>
                </button>
                <button onclick="startTimer(5)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 px-6 rounded-xl transition shadow-lg flex justify-between items-center text-lg">
                    <span id="ui-btn-5">5 Minutes</span>
                    <span id="ui-desc-5" class="text-emerald-200 text-sm">Quick Bio Break</span>
                </button>
            </div>

            <div class="border-t border-gray-700 pt-6">
                <label id="ui-custom-label" class="block text-sm font-medium text-gray-300 mb-2">Custom Duration (Minutes)</label>
                <div class="flex gap-3">
                    <input type="number" id="custom-minutes" min="1" max="120" value="20" class="flex-1 bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 text-lg text-center font-bold" dir="ltr">
                    <button id="ui-btn-start" onclick="startCustomTimer()" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-xl transition">
                        Start
                    </button>
                </div>
            </div>
        </div>

        <!-- Made by Footer -->
        <div class="absolute bottom-6 left-0 w-full text-center z-0">
            <p class="text-gray-500 text-sm hover:text-gray-300 transition-colors">
                <span id="ui-made-by">Made by</span> 
                <a href="https://www.linkedin.com/in/omaryaseen?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" rel="noopener noreferrer" class="font-bold text-emerald-500 hover:text-emerald-400 underline decoration-emerald-500/30 underline-offset-4">
                    <span id="ui-author">Omar Yaseen</span>
                </a>
            </p>
        </div>
    </div>

    <!-- Timer Screen -->
    <div id="timer-screen" class="hidden color-transition h-screen w-screen flex flex-col items-center justify-center relative bg-emerald-500 text-white">
        
        <!-- The Giant Clock -->
        <div id="time-display" class="timer-font font-bold tracking-tight z-10 text-center px-4 w-full truncate cursor-default pointer-events-none">
            15:00
        </div>
        
        <div id="times-up-text" class="hidden absolute top-1/4 text-4xl md:text-6xl font-bold uppercase tracking-widest opacity-80 animate-bounce pointer-events-none">
            Time is up!
        </div>

        <div id="paused-text" class="hidden absolute top-1/4 text-3xl md:text-5xl font-bold uppercase tracking-widest opacity-90 pointer-events-none">
            Paused
        </div>

        <!-- Controls Area (Bottom) -->
        <div id="controls-container" class="absolute bottom-0 left-0 w-full pt-32 pb-8 flex items-end justify-center transition-opacity duration-500 z-20 bg-gradient-to-t from-black/60 to-transparent">
            <!-- direction is forced LTR so icons stay in logical order regardless of language -->
            <div class="flex items-center gap-4 md:gap-8 bg-black/50 backdrop-blur-md rounded-3xl px-6 py-4 border border-white/10" dir="ltr">
                
                <!-- Play/Pause -->
                <button id="btn-pause" onclick="togglePause(event)" class="flex flex-col items-center gap-2 p-2 rounded-xl hover:bg-white/20 transition text-white w-20">
                    <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    <svg id="icon-play" class="hidden" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <span id="lbl-pause" class="text-xs font-bold uppercase tracking-wider">Pause</span>
                </button>

                <!-- Stop/Leave -->
                <button id="btn-stop" onclick="stopTimer(event)" class="flex flex-col items-center gap-2 p-2 rounded-xl hover:bg-white/20 transition text-rose-300 hover:text-rose-200 w-20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                    <span id="lbl-stop" class="text-xs font-bold uppercase tracking-wider">Leave</span>
                </button>

                <!-- Fullscreen Toggle -->
                <button id="btn-fullscreen" onclick="toggleFullScreen(event)" class="flex flex-col items-center gap-2 p-2 rounded-xl hover:bg-white/20 transition text-white w-20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    <span id="lbl-fullscreen" class="text-xs font-bold uppercase tracking-wider">Fullscreen</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Localization (i18n) Data ---
        const translations = {
            en: {
                toggleBtn: "عربي",
                title: "Break Timer",
                subtitle: "Traffic light visual system: Green → Yellow (2 min warning) → Red",
                btn15: "15 Minutes",
                desc15: "Standard Break",
                btn10: "10 Minutes",
                desc10: "Group Exercise",
                btn5: "5 Minutes",
                desc5: "Quick Bio Break",
                customLabel: "Custom Duration (Minutes)",
                btnStart: "Start",
                madeBy: "Made by",
                author: "Omar Yaseen",
                timesUp: "Time is up!",
                paused: "Paused",
                lblPause: "Pause",
                lblResume: "Resume",
                lblStop: "Leave",
                lblFullscreen: "Fullscreen"
            },
            ar: {
                toggleBtn: "English",
                title: "مؤقت الاستراحة",
                subtitle: "نظام إشارة المرور: أخضر ← أصفر (تحذير دقيقتين) ← أحمر",
                btn15: "15 دقيقة",
                desc15: "استراحة قياسية",
                btn10: "10 دقائق",
                desc10: "تمرين جماعي",
                btn5: "5 دقائق",
                desc5: "استراحة قصيرة",
                customLabel: "مدة مخصصة (بالدقائق)",
                btnStart: "ابدأ",
                madeBy: "صُنع بواسطة",
                author: "عمر ياسين (Omar Yaseen)",
                timesUp: "انتهى الوقت!",
                paused: "إيقاف مؤقت",
                lblPause: "إيقاف",
                lblResume: "استئناف",
                lblStop: "خروج",
                lblFullscreen: "شاشة كاملة"
            }
        };

        let currentLang = 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            
            // Update HTML dir and lang attributes
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;
            
            // Apply translations to UI
            document.getElementById('lang-btn-text').textContent = translations[currentLang].toggleBtn;
            document.getElementById('ui-title').textContent = translations[currentLang].title;
            document.getElementById('ui-subtitle').textContent = translations[currentLang].subtitle;
            
            document.getElementById('ui-btn-15').textContent = translations[currentLang].btn15;
            document.getElementById('ui-desc-15').textContent = translations[currentLang].desc15;
            document.getElementById('ui-btn-10').textContent = translations[currentLang].btn10;
            document.getElementById('ui-desc-10').textContent = translations[currentLang].desc10;
            document.getElementById('ui-btn-5').textContent = translations[currentLang].btn5;
            document.getElementById('ui-desc-5').textContent = translations[currentLang].desc5;
            
            document.getElementById('ui-custom-label').textContent = translations[currentLang].customLabel;
            document.getElementById('ui-btn-start').textContent = translations[currentLang].btnStart;
            
            document.getElementById('ui-made-by').textContent = translations[currentLang].madeBy;
            document.getElementById('ui-author').textContent = translations[currentLang].author;
            
            document.getElementById('times-up-text').textContent = translations[currentLang].timesUp;
            document.getElementById('paused-text').textContent = translations[currentLang].paused;
            
            // Update control labels
            document.getElementById('lbl-pause').textContent = isPaused ? translations[currentLang].lblResume : translations[currentLang].lblPause;
            document.getElementById('lbl-stop').textContent = translations[currentLang].lblStop;
            document.getElementById('lbl-fullscreen').textContent = translations[currentLang].lblFullscreen;
        }


        // --- Timer Logic ---
        let timerInterval;
        let remainingSeconds = 0;
        let isPaused = false;

        const setupScreen = document.getElementById('setup-screen');
        const timerScreen = document.getElementById('timer-screen');
        const timeDisplay = document.getElementById('time-display');
        const timesUpText = document.getElementById('times-up-text');
        const pausedText = document.getElementById('paused-text');
        
        const controlsContainer = document.getElementById('controls-container');
        const iconPause = document.getElementById('icon-pause');
        const iconPlay = document.getElementById('icon-play');
        const lblPause = document.getElementById('lbl-pause');

        const WARNING_THRESHOLD = 120; // 2 minutes (120 seconds)

        // --- Controls Visibility Logic ---
        let hideControlsTimeout;
        let controlsVisible = true;

        function showControls() {
            controlsContainer.classList.remove('opacity-0', 'pointer-events-none');
            controlsContainer.classList.add('opacity-100');
            controlsVisible = true;
            resetIdleTimer();
        }

        function hideControls() {
            controlsContainer.classList.remove('opacity-100');
            // Adding pointer-events-none ensures hidden buttons can't be clicked
            controlsContainer.classList.add('opacity-0', 'pointer-events-none');
            controlsVisible = false;
            clearTimeout(hideControlsTimeout);
        }

        function resetIdleTimer() {
            clearTimeout(hideControlsTimeout);
            hideControlsTimeout = setTimeout(hideControls, 3000);
        }

        // Screen Click: Toggles visibility
        timerScreen.addEventListener('click', (e) => {
            // Ignore if the user is clicking directly on the controls
            if (e.target.closest('#controls-container')) return;

            if (controlsVisible) {
                hideControls();
            } else {
                showControls();
            }
        });

        // Mouse Move: Wakes up controls and resets idle timer
        timerScreen.addEventListener('mousemove', () => {
            if (!controlsVisible) {
                showControls();
            } else {
                resetIdleTimer();
            }
        });

        // --- Timer Functions ---
        function startCustomTimer() {
            const mins = parseInt(document.getElementById('custom-minutes').value);
            if (mins > 0) {
                startTimer(mins);
            }
        }

        function startTimer(minutes) {
            remainingSeconds = minutes * 60;
            isPaused = false;
            
            // UI Switch
            setupScreen.classList.add('hidden');
            timerScreen.classList.remove('hidden');
            timesUpText.classList.add('hidden');
            pausedText.classList.add('hidden');
            timeDisplay.classList.remove('opacity-30');
            
            // Reset icons & labels
            iconPause.classList.remove('hidden');
            iconPlay.classList.add('hidden');
            lblPause.textContent = translations[currentLang].lblPause;

            updateDisplay();
            showControls(); // Show controls when starting
            
            // Clear existing interval if any
            if (timerInterval) clearInterval(timerInterval);
            
            // Start the loop
            timerInterval = setInterval(tick, 1000);
        }

        function tick() {
            if (!isPaused) {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateDisplay();
                } else {
                    handleTimeUp();
                }
            }
        }

        function updateDisplay() {
            // Calculate MM:SS
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            
            // Format with leading zeros
            const displayStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            timeDisplay.textContent = displayStr;

            // Traffic Light Color Logic
            if (remainingSeconds === 0) {
                timerScreen.className = 'color-transition h-screen w-screen flex flex-col items-center justify-center relative bg-red-600 text-white cursor-pointer';
            } else if (remainingSeconds <= WARNING_THRESHOLD) {
                timerScreen.className = 'color-transition h-screen w-screen flex flex-col items-center justify-center relative bg-yellow-400 text-gray-900 cursor-pointer';
            } else {
                timerScreen.className = 'color-transition h-screen w-screen flex flex-col items-center justify-center relative bg-emerald-500 text-white cursor-pointer';
            }
        }

        function handleTimeUp() {
            clearInterval(timerInterval);
            timeDisplay.textContent = "00:00";
            timesUpText.classList.remove('hidden');
            timerScreen.classList.add('bg-red-600');
            timerScreen.classList.add('animate-pulse');
            setTimeout(() => {
                timerScreen.classList.remove('animate-pulse');
            }, 3000);
        }

        function togglePause(event) {
            if (event) event.stopPropagation(); // Prevent the screen click toggle
            if (remainingSeconds <= 0) return; 
            
            isPaused = !isPaused;
            
            if (isPaused) {
                iconPause.classList.add('hidden');
                iconPlay.classList.remove('hidden');
                lblPause.textContent = translations[currentLang].lblResume;
                timeDisplay.classList.add('opacity-30');
                pausedText.classList.remove('hidden');
            } else {
                iconPause.classList.remove('hidden');
                iconPlay.classList.add('hidden');
                lblPause.textContent = translations[currentLang].lblPause;
                timeDisplay.classList.remove('opacity-30');
                pausedText.classList.add('hidden');
            }
            resetIdleTimer();
        }

        function stopTimer(event) {
            if (event) event.stopPropagation();
            clearInterval(timerInterval);
            setupScreen.classList.remove('hidden');
            timerScreen.classList.add('hidden');
            
            // Exit fullscreen if active
            const doc = document;
            if (doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement) {
                if (doc.exitFullscreen) doc.exitFullscreen();
                else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
                else if (doc.mozCancelFullScreen) doc.mozCancelFullScreen();
                else if (doc.msExitFullscreen) doc.msExitFullscreen();
            }
        }

        // --- Robust Cross-Browser Fullscreen ---
        function toggleFullScreen(event) {
            if (event) event.stopPropagation();
            const docElm = document.documentElement;
            const doc = document;
            
            const isFullscreen = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

            if (!isFullscreen) {
                // Force Enter Fullscreen
                if (docElm.requestFullscreen) docElm.requestFullscreen();
                else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
                else if (docElm.mozRequestFullScreen) docElm.mozRequestFullScreen();
                else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
            } else {
                // Exit Fullscreen
                if (doc.exitFullscreen) doc.exitFullscreen();
                else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
                else if (doc.mozCancelFullScreen) doc.mozCancelFullScreen();
                else if (doc.msExitFullscreen) doc.msExitFullscreen();
            }
            resetIdleTimer();
        }
    </script>
</body>
</html>
